[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-agent"
version = "0.1.0"
description = "An open-source, agentic survey engine — define surveys as data; AI authors, administers, and analyzes them. Runs anywhere."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Paul Neto" }]
keywords = ["survey", "screener", "agentic", "llm", "questionnaire", "forms"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Operating System :: OS Independent",
]
dependencies = [
  "jsonschema>=4",
  "PyYAML>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]                 # Claude (authoring / conversational / analysis)
openai = ["openai>=1.40"]                 # GPT / Codex (same features, your choice of model)
mcp = ["mcp>=1.2,<2"]   # 2.x renamed FastMCP → MCPServer; port before lifting
mongo = ["pymongo"]                       # multi-instance store for the stdlib runtime: SURVEY_STORE=mongo + serve --multi
api = ["fastapi>=0.110", "uvicorn>=0.23"] # the API gateway (`survey-agent api`); clients (SURVEY_*=http) need NO extra — stdlib urllib
auth = ["Authlib>=1.3", "PyJWT>=2.10", "itsdangerous>=2.2", "python-multipart>=0.0.20", "httpx>=0.27"]  # gateway auth: Google OAuth sign-in + sa_ API keys (separate from [api] so the bare token-gated gateway stays lean)
s3 = ["boto3"]                            # S3 blob store for `file` uploads: SURVEY_UPLOAD_STORE=s3 + SURVEY_UPLOAD_BUCKET
firebolt = ["firebolt-sdk"]
data = ["pandas>=2", "pyarrow>=15"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.23", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/paulneto/survey-agent"
Source = "https://github.com/paulneto/survey-agent"

[project.scripts]
survey-agent = "survey_agent.cli:main"
sva = "survey_agent.cli:main"            # short alias for the agentic loop
survey-agent-mcp = "survey_agent.mcp.server:main"   # the MCP server (needs the [mcp] extra)

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
survey_agent = [
  "engine/schema/*.json",
  "personas/*.json",
  "themes/*.css",
  "themes/*/*.json",
  "themes/*/*.css",
  "enrich/*.json",
  "enrichments/*.json",
  "examples/*",
  "templates/*/*.yaml",
  "templates/*/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
